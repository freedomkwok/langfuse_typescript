apiVersion: v1
kind: Pod
metadata:
  name: oci-storage-test
  labels:
    app: oci-storage-test
spec:
  containers:
  - name: test
    image: oci-storage-test:latest
    imagePullPolicy: IfNotPresent
    env:
    - name: OCI_BUCKET_NAME
      value: "your-bucket-name"  # Replace with your bucket name
    - name: OCI_REGION
      value: "us-phoenix-1"  # Replace with your region
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"
  restartPolicy: Never

